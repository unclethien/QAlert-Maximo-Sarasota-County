name: Deploy slide deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - 'data/**'
      - 'assets/showoff/sarasota-similarity-data-pipeline/**'
      - '.github/workflows/deploy-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue the newest one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - run: npm ci
      # The deck reads its numbers from ../data at build time.
      - run: npm run build
      # The similarity and data pipeline deck is static HTML; it ships as-is
      # under its own path next to the dataset deck.
      - name: Add the similarity and data pipeline deck
        run: |
          src=../assets/showoff/sarasota-similarity-data-pipeline
          out=dist/similarity-pipeline
          mkdir -p "$out"
          cp -R "$src/index.html" "$src/css" "$src/js" "$src/fonts" "$out/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: presentation/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
